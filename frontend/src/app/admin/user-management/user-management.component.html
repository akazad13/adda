<div class="table-panel overflow-hidden border-secondary border-opacity-25">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-dark border-bottom border-secondary border-opacity-50">
        <tr>
          <th scope="col" style="width: 10%">ID</th>
          <th scope="col" style="width: 35%">User</th>
          <th scope="col" style="width: 40%">Assigned Roles</th>
          <th scope="col" class="text-end" style="width: 15%">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users; track user.id) {
        <tr>
          <td class="fw-bold text-muted-custom">#{{ user.id }}</td>
          <td>
            <div class="d-flex align-items-center gap-2">
              <span class="fw-semibold">{{ user.userName }}</span>
            </div>
          </td>
          <td>
            <div class="d-flex flex-wrap gap-1">
              @for (role of user.roles; track role) {
              <span class="badge rounded-pill" [class.badge-brand]="role === 'Admin'"
                [class.badge-accent]="role === 'Moderator'" [class.badge-glass]="role === 'Member'">
                {{ role }}
              </span>
              }
            </div>
          </td>
          <td class="text-end">
            <button type="button" class="btn btn-sm btn-outline-light" (click)="editRolesModal(user)">
              <i class="fa-solid fa-pen-to-square me-1"></i> Edit Roles
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
