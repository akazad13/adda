@if (photos.length) {
<div class="photo-grid">
  @for (photo of photos; track photo.id) {
  <div class="photo-card-wrapper">
    <div
      class="glass-panel photo-card overflow-hidden position-relative p-2.5 text-center h-100 d-flex flex-column justify-content-between">
      <div class="fw-bold fs-xs text-truncate mb-2 mt-2" title="{{ photo.userName }}">
        <i class="fa-solid fa-user me-1 text-gradient-accent"></i>{{ photo.userName }}
      </div>

      <div class="position-relative overflow-hidden rounded mb-2" style="aspect-ratio: 1;">
        <img [src]="photo.url" [alt]="photo.userName" class="w-100 object-cover" />
        <span class="img-badge-solid">
          <i class="fa-solid fa-clock me-1"></i>Pending
        </span>
      </div>

      <div class="photo-card-actions">
        <button type="button" class="btn-approve" (click)="approvePhoto(photo.id)" title="Approve photo">
          <i class="fa-solid fa-check"></i> Approve
        </button>
        <button type="button" class="btn-reject" (click)="rejectPhoto(photo.id)" title="Reject photo">
          <i class="fa-solid fa-xmark"></i> Reject
        </button>
      </div>
    </div>
  </div>
  }
</div>
} @else {
<div class="text-center py-5 text-muted-custom">
  <i class="fa-solid fa-circle-check fs-1 text-success mb-2 d-block"></i>
  <h3 class="h5 fw-bold text-white mb-1">Queue Clear</h3>
  <p class="mb-0 fs-sm">There are no pending user photos awaiting moderation.</p>
</div>
}
