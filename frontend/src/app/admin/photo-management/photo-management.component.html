@if (photos.length) {
  <div class="row g-3 g-md-4">
    @for (photo of photos; track photo.id) {
      <div class="col-6 col-sm-4 col-md-3 col-lg-2">
        <div class="glass-panel overflow-hidden position-relative p-2 text-center h-100 d-flex flex-column justify-content-between">
          <div class="fw-bold fs-xs text-truncate mb-2">
            <i class="fa-solid fa-user me-1 text-gradient-accent"></i>{{ photo.userName }}
          </div>

          <div class="position-relative overflow-hidden rounded mb-2" style="aspect-ratio: 1;">
            <img [src]="photo.url" [alt]="photo.userName" class="w-100 h-100 object-cover" />
            <span class="img-badge-solid">
              <i class="fa-solid fa-clock me-1"></i>Pending
            </span>
          </div>

          <div class="d-flex gap-1 justify-content-center pt-1">
            <button type="button" class="btn btn-primary btn-xs flex-fill" (click)="approvePhoto(photo.id)">
              <i class="fa-solid fa-check me-1"></i> Approve
            </button>
            <button type="button" class="btn btn-outline-danger btn-xs flex-fill" (click)="rejectPhoto(photo.id)">
              <i class="fa-solid fa-xmark me-1"></i> Reject
            </button>
          </div>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="text-center py-5 text-muted-custom">
    <i class="fa-solid fa-circle-check fs-1 text-success mb-2 d-block"></i>
    <h3 class="h5 fw-bold text-white mb-1">Queue Clear</h3>
    <p class="mb-0 fs-sm">There are no pending user photos awaiting moderation.</p>
  </div>
}
